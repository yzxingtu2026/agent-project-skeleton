name: DingTalk Notify Main Updated

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send main updated notification
        env:
          DINGTALK_COLLAB_WEBHOOK: ${{ secrets.DINGTALK_COLLAB_WEBHOOK }}
          DINGTALK_COLLAB_SIGN_SECRET: ${{ secrets.DINGTALK_COLLAB_SIGN_SECRET }}
        run: node .github/scripts/dingtalk-main-updated.mjs
