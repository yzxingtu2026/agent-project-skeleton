name: GitHub Main Updated Notify

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send main updated notification
        env:
          WECOM_COLLAB_WEBHOOK: ${{ secrets.WECOM_COLLAB_WEBHOOK }}
        run: node .github/scripts/github-main-updated.mjs
